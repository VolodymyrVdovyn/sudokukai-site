<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Support for the Sudokukai mobile app." />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ffffff"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#000000"
    />
    <title>Support · Sudokukai</title>
    <link
      rel="icon"
      href="../assets/icon-light.png"
      type="image/png"
      media="(prefers-color-scheme: light)"
      data-theme-icon="light"
    />
    <link
      rel="icon"
      href="../assets/icon-dark.png"
      type="image/png"
      media="(prefers-color-scheme: dark)"
      data-theme-icon="dark"
    />
    <script src="../components/theme.js"></script>
    <link rel="stylesheet" href="../assets/styles.css" />
    <script src="../components/header.js" defer></script>
    <script src="../components/footer.js" defer></script>
  </head>
  <body class="support-page">
    <sudokukai-header current="support"></sudokukai-header>

    <main class="document">
      <p class="eyebrow">Help and contact</p>
      <h1>Support</h1>
      <p class="lead">
        Need help with Sudokukai? Contact us by email.
      </p>

      <h2>Contact</h2>
      <p>
        Email
        <a class="contact" href="mailto:sudokukai.support@gmail.com"
          >sudokukai.support@gmail.com</a
        >.
      </p>

      <h2>Developer</h2>
      <p>Sudokukai is developed by Volodymyr Vdovyn, Sole Proprietor.</p>

      <h2>Privacy</h2>
      <p>
        Read the <a href="../privacy/">Privacy Policy</a> to learn how Sudokukai
        handles data.
      </p>
    </main>

    <sudokukai-footer></sudokukai-footer>
  </body>
</html>
